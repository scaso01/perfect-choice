[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perfect-choice"
version = "0.1.0"
description = "AHP-based decision-making CLI with LLM-assisted analysis"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "rich>=14.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
charts = ["plotext>=5.2.0"]
dashboard = [
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
]
dev = [
    "pytest>=8.0.0",
    "pyflakes>=3.2.0",
    "respx>=0.22.0",
    # The dashboard journey tests drive the real app through streamlit's AppTest.
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
]

[project.scripts]
perfect-choice = "perfect_choice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "integration: tests requiring live LLM or services",
    "slow: tests taking >2s",
]
