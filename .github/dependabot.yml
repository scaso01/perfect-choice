version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      all-dependencies:
        patterns: ["*"]
    ignore:
      # pyproject caps plotext below 6 (a rewrite); without this Dependabot widens the cap.
      - dependency-name: plotext
        update-types: ["version-update:semver-major"]
