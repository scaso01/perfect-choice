name: Newest libraries

# CI pins versions (requirements-ci.txt). This weekly run installs the newest allowed
# versions instead, so a release that breaks a fresh install shows up within a week.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      fail_on_purpose:
        description: "Fail after the tests, to check how a failure is shown"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,dashboard,charts]"
      - run: python -m pyflakes src tests
      - run: pytest tests/ -q
      - if: inputs.fail_on_purpose
        run: exit 1
